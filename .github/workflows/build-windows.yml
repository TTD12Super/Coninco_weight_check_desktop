name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Build Python engine
        working-directory: desktop-app
        shell: pwsh
        run: .\scripts\build-engine.ps1

      - name: Verify Python engine
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE "desktop-app\src-tauri\engine\excel-auditor-engine.exe"
          if (-not (Test-Path $engine)) {
            throw "Packaged Python engine was not created: $engine"
          }
          Get-Item $engine | Select-Object FullName, Length

      - name: Run Python tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "python-engine\src"
          $python = Join-Path $env:GITHUB_WORKSPACE "python-engine\.venv\Scripts\python.exe"
          & $python -m unittest discover -s python-engine/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installers
        working-directory: desktop-app
        run: npm run tauri:build

      - name: Verify installers
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "desktop-app\src-tauri\target\release\bundle"
          $artifacts = @(
            Get-ChildItem (Join-Path $bundle "msi") -File -ErrorAction SilentlyContinue
            Get-ChildItem (Join-Path $bundle "nsis") -File -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows installer was created under $bundle"
          }
          $artifacts | Select-Object FullName, Length

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: coninco-excel-auditor-windows
          if-no-files-found: error
          path: |
            desktop-app/src-tauri/target/release/bundle/msi/*
            desktop-app/src-tauri/target/release/bundle/nsis/*
